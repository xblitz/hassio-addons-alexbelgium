# Home Assistant ingress front for Firefly III.
#
# The Supervisor strips the /api/hassio_ingress/<token>/ prefix before
# proxying, so the app keeps seeing / as its root. What the Supervisor does
# NOT do is rewrite absolute URLs in responses or Location headers, so this
# server re-prefixes them with the per-request X-Ingress-Path header (set by
# Home Assistant Core on every ingress request, hence never stale).
#
# Port 8099 must match ingress_port in config.yaml. This listener is
# ingress-only and unpublished; direct access stays on :8080.

server {
    listen 8099 default_server;

    # Large CSV imports go through this extra hop (connect stays default:
    # localhost either connects instantly or refuses)
    client_max_body_size 0;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Pin what the app sees to the browser-facing values HA Core sent.
        # Our own hop is plain http on localhost, so $scheme/$http_host
        # would lie to Laravel's URL generator (TRUSTED_PROXIES=** honors
        # the forwarded headers instead).
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # sub_filter cannot rewrite compressed bodies; HA Core compresses
        # at the border itself.
        proxy_set_header Accept-Encoding "";

        # Firefly sends X-Frame-Options: deny on every response, which would
        # blank the ingress iframe. Strip it here (direct :8080 keeps it)
        # and re-allow same-origin framing only: the ingress iframe is
        # served from the HA origin itself.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Keep redirects inside the ingress path
        absolute_redirect off;
        proxy_redirect http://$http_x_forwarded_host/ $http_x_ingress_path/;
        proxy_redirect https://$http_x_forwarded_host/ $http_x_ingress_path/;
        proxy_redirect / $http_x_ingress_path/;

        # Re-prefix the absolute and root-relative URLs the app emits
        # NB: no application/json - XHR payloads resolve relative URLs
        # client-side, while rewriting would corrupt user data that happens
        # to look like a path (e.g. a transaction named "/apiary").
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'http://$http_x_forwarded_host/' '$http_x_ingress_path/';
        sub_filter 'https://$http_x_forwarded_host/' '$http_x_ingress_path/';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter "href='/" "href='$http_x_ingress_path/";
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter "src='/" "src='$http_x_ingress_path/";
        sub_filter 'action="/' 'action="$http_x_ingress_path/';
        sub_filter "action='/" "action='$http_x_ingress_path/";
        sub_filter 'url(/' 'url($http_x_ingress_path/';
        sub_filter '"/api' '"$http_x_ingress_path/api';
        sub_filter "'/api" "'$http_x_ingress_path/api";
    }
}
